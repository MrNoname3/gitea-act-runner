name: Job image

# Builds job-image.Containerfile, the image the runners' ubuntu-latest label can
# run (CI_JOB_IMAGE in runner.env), and from main pushes it to ghcr.io: as
# ghcr.io/<owner>/act-ubuntu:26.04, which the runners re-pull before every job,
# and as :26.04-<run number>, which stays put for going back to. The monthly run
# picks up Ubuntu's package updates, which change no line here.
#
# GitHub's run alone: its job token can push to ghcr.io, a registry every runner
# reaches, and the build costs the runners nothing. The mirror receives every
# branch, so a Renovate pull request is built there too.
on:
  push:
    branches: ['**']
    paths:
      - job-image.Containerfile
      - .github/workflows/job-image.yml
  schedule:
    - cron: '0 4 2 * *'     # the 2nd, after Renovate's monthly digest update on the 1st
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, and push from main
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image=ghcr.io/$owner/act-ubuntu
          # created: this build's time, where the image would carry the base image's.
          buildah --storage-driver vfs build --isolation chroot -f job-image.Containerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$image:26.04" -t "$image:26.04-$GITHUB_RUN_NUMBER" .
          # Every runner's next job pulls :26.04, so it has to run what a job needs.
          # --pull=never: some buildah versions pull by default when the registry's
          # :26.04 differs, which would replace this build with the published one.
          ctr=$(buildah --storage-driver vfs from --pull=never "$image:26.04")
          buildah --storage-driver vfs run --isolation chroot "$ctr" -- sh -euc '
            node --version; git --version; lsb_release -rs; zstd --version
            python3 -m venv /tmp/venv && /tmp/venv/bin/python --version'
          buildah --storage-driver vfs rm "$ctr"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Built $image; only main pushes it."
            exit 0
          fi
          echo "$TOKEN" | buildah login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          buildah --storage-driver vfs push "$image:26.04-$GITHUB_RUN_NUMBER"
          buildah --storage-driver vfs push "$image:26.04"
          echo "Pushed $image:26.04 and $image:26.04-$GITHUB_RUN_NUMBER"
